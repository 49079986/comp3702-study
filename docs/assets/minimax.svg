<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img"><title>Alpha-beta: prune branches that cannot improve the choice</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#167d87" stroke-width="1.6"/></marker></defs><rect width="1000" height="420" rx="20" fill="#f2f6f5"/><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#172c3b} .t{font-size:24px;font-weight:700}.s{font-size:16px;fill:#526875}.b{font-size:19px;font-weight:600}.n{font-size:17px}</style><text class="t" x="35" y="43">Alpha-beta: prune branches that cannot improve the choice</text><text class="s" x="35" y="73">MAX already has 3. A MIN branch bounded above by 2 cannot improve it.</text><path d="M420,175 L180,245" stroke="#167d87" stroke-width="2.4" marker-end="url(#arr)" fill="none"/><path d="M500,175 L500,245" stroke="#167d87" stroke-width="2.4" marker-end="url(#arr)" fill="none"/><path d="M580,175 L825,245" stroke="#167d87" stroke-width="2.4" marker-end="url(#arr)" fill="none"/><rect x="400" y="105" width="200" height="70" rx="12" fill="#ffe5a2" stroke="#b9d1d2"/><text class="b" text-anchor="middle" x="500.0" y="146.0">Root MAX → 4</text><rect x="60" y="245" width="230" height="95" rx="12" fill="#deece9" stroke="#b9d1d2"/><text class="b" text-anchor="middle" x="175.0" y="285.0">A · MIN</text><text class="b" text-anchor="middle" x="175.0" y="312.0">min(3,5,6)=3</text><rect x="385" y="245" width="230" height="95" rx="12" fill="#fff" stroke="#b9d1d2"/><text class="b" text-anchor="middle" x="500.0" y="285.0">B · MIN</text><text class="b" text-anchor="middle" x="500.0" y="312.0">2, [9,1 pruned]</text><rect x="710" y="245" width="230" height="95" rx="12" fill="#deece9" stroke="#b9d1d2"/><text class="b" text-anchor="middle" x="825.0" y="285.0">C · MIN</text><text class="b" text-anchor="middle" x="825.0" y="312.0">min(4,7,8)=4</text><text class="n" x="40" y="390">B 的已知上界是 2；其真实值为 1，但求根决策不必知道它。</text></svg>