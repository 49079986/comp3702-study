<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img"><title>AND-OR: choose one action, cover all outcomes / 条件计划</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#167d87" stroke-width="1.6"/></marker></defs><rect width="1000" height="420" rx="20" fill="#f2f6f5"/><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#172c3b} .t{font-size:24px;font-weight:700}.s{font-size:16px;fill:#526875}.b{font-size:19px;font-weight:600}.n{font-size:17px}</style><text class="t" x="35" y="43">AND-OR: choose one action, cover all outcomes / 条件计划</text><text class="s" x="35" y="73">An OR node chooses; an AND node must cover every possible result.</text><path d="M170,200 L285,200" stroke="#167d87" stroke-width="2.4" marker-end="url(#arr)" fill="none"/><text class="s" text-anchor="middle" x="227.5" y="182.0">Choose</text><path d="M455,200 L560,200" stroke="#167d87" stroke-width="2.4" marker-end="url(#arr)" fill="none"/><text class="s" text-anchor="middle" x="507.5" y="182.0">Choose</text><path d="M730,185 L825,143" stroke="#167d87" stroke-width="2.4" marker-end="url(#arr)" fill="none"/><text class="s" text-anchor="middle" x="777.5" y="146.0">High grip</text><path d="M730,220 L825,300" stroke="#167d87" stroke-width="2.4" marker-end="url(#arr)" fill="none"/><text class="s" text-anchor="middle" x="777.5" y="242.0">Low grip</text><rect x="40" y="165" width="130" height="75" rx="12" fill="#fff" stroke="#b9d1d2"/><text class="b" text-anchor="middle" x="105.0" y="208.5">S · OR</text><rect x="285" y="165" width="170" height="75" rx="12" fill="#deece9" stroke="#b9d1d2"/><text class="b" text-anchor="middle" x="370.0" y="208.5">Drive → A</text><rect x="560" y="165" width="170" height="75" rx="12" fill="#ffe5a2" stroke="#b9d1d2"/><text class="b" text-anchor="middle" x="645.0" y="208.5">Climb · AND</text><rect x="825" y="110" width="120" height="65" rx="12" fill="#deece9" stroke="#b9d1d2"/><text class="b" text-anchor="middle" x="885.0" y="148.5">G</text><rect x="825" y="270" width="120" height="65" rx="12" fill="#deece9" stroke="#b9d1d2"/><text class="b" text-anchor="middle" x="885.0" y="308.5">B → G</text><text class="n" x="40" y="360">Risky Jump 的 DEAD 分支使其失败；不能只保留那个能到 G 的结果。</text></svg>