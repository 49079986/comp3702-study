<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img"><title>Learning targets / 学习目标</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#167d87" stroke-width="1.6"/></marker></defs><rect width="1000" height="420" rx="20" fill="#f2f6f5"/><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#172c3b} .t{font-size:24px;font-weight:700}.s{font-size:16px;fill:#526875}.b{font-size:19px;font-weight:600}.n{font-size:17px}</style><text class="t" x="35" y="43">Learning targets / 学习目标</text><text class="s" x="35" y="73">estimate ← estimate + α × (target − estimate)</text><rect x="35" y="150" width="210" height="125" rx="12" fill="#fff" stroke="#b9d1d2"/><text class="b" text-anchor="middle" x="140.0" y="205.0">MC</text><text class="b" text-anchor="middle" x="140.0" y="232.0">Episode return G</text><rect x="275" y="150" width="210" height="125" rx="12" fill="#deece9" stroke="#b9d1d2"/><text class="b" text-anchor="middle" x="380.0" y="205.0">TD(0)</text><text class="b" text-anchor="middle" x="380.0" y="232.0">r + γV(s′)</text><rect x="515" y="150" width="210" height="125" rx="12" fill="#ffe5a2" stroke="#b9d1d2"/><text class="b" text-anchor="middle" x="620.0" y="205.0">Q-learning</text><text class="b" text-anchor="middle" x="620.0" y="232.0">r + γ max Q′</text><rect x="755" y="150" width="210" height="125" rx="12" fill="#fff" stroke="#b9d1d2"/><text class="b" text-anchor="middle" x="860.0" y="205.0">SARSA</text><text class="b" text-anchor="middle" x="860.0" y="232.0">r + γQ(s′,a′)</text><text class="n" x="40" y="335">Q-learning：贪心目标策略；SARSA：实际执行的下一个动作。</text><text class="n" x="40" y="375">真正终止后继的未来价值 = 0，因此 target = r。</text></svg>