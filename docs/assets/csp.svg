<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img"><title>Arc consistency: every value needs support / 弧一致</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#167d87" stroke-width="1.6"/></marker></defs><rect width="1000" height="420" rx="20" fill="#f2f6f5"/><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#172c3b} .t{font-size:24px;font-weight:700}.s{font-size:16px;fill:#526875}.b{font-size:19px;font-weight:600}.n{font-size:17px}</style><text class="t" x="35" y="43">Arc consistency: every value needs support / 弧一致</text><text class="s" x="35" y="73">Revise X → Y by checking each value of X against the domain of Y.</text><path d="M290,200 L420,200" stroke="#167d87" stroke-width="2.4" marker-end="url(#arr)" fill="none"/><text class="s" text-anchor="middle" x="355.0" y="182.0">∀x，∃y</text><path d="M645,200 L765,200" stroke="#167d87" stroke-width="2.4" marker-end="url(#arr)" fill="none"/><text class="s" text-anchor="middle" x="705.0" y="182.0">No support: delete</text><rect x="65" y="145" width="225" height="110" rx="12" fill="#fff" stroke="#b9d1d2"/><text class="b" text-anchor="middle" x="177.5" y="192.5">X: {1,2,3}</text><text class="b" text-anchor="middle" x="177.5" y="219.5">X &lt; Y</text><rect x="420" y="145" width="225" height="110" rx="12" fill="#deece9" stroke="#b9d1d2"/><text class="b" text-anchor="middle" x="532.5" y="192.5">Y: {2,3}</text><text class="b" text-anchor="middle" x="532.5" y="219.5">Support / 支持</text><rect x="765" y="145" width="175" height="110" rx="12" fill="#ffe5a2" stroke="#b9d1d2"/><text class="b" text-anchor="middle" x="852.5" y="192.5">Delete X=3</text><text class="b" text-anchor="middle" x="852.5" y="219.5">No Y&gt;3</text><text class="n" x="65" y="325">x=1 可由 y=2 支持；x=2 可由 y=3 支持；x=3 无支持。</text><text class="n" x="65" y="365">局部都有支持，仍不代表所有约束能同时满足。</text></svg>