<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img"><title>MCTS: selection → expansion → simulation → backup</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#167d87" stroke-width="1.6"/></marker></defs><rect width="1000" height="420" rx="20" fill="#f2f6f5"/><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#172c3b} .t{font-size:24px;font-weight:700}.s{font-size:16px;fill:#526875}.b{font-size:19px;font-weight:600}.n{font-size:17px}</style><text class="t" x="35" y="43">MCTS: selection → expansion → simulation → backup</text><text class="s" x="35" y="73">Tree exploration scores and final action recommendations serve different purposes.</text><path d="M230,205 L275,205" stroke="#167d87" stroke-width="2.4" marker-end="url(#arr)" fill="none"/><path d="M470,205 L515,205" stroke="#167d87" stroke-width="2.4" marker-end="url(#arr)" fill="none"/><path d="M710,205 L755,205" stroke="#167d87" stroke-width="2.4" marker-end="url(#arr)" fill="none"/><rect x="35" y="155" width="195" height="100" rx="12" fill="#deece9" stroke="#b9d1d2"/><text class="b" text-anchor="middle" x="132.5" y="197.5">1 Selection</text><text class="b" text-anchor="middle" x="132.5" y="224.5">树内选择</text><rect x="275" y="155" width="195" height="100" rx="12" fill="#fff" stroke="#b9d1d2"/><text class="b" text-anchor="middle" x="372.5" y="197.5">2 Expansion</text><text class="b" text-anchor="middle" x="372.5" y="224.5">扩展新节点</text><rect x="515" y="155" width="195" height="100" rx="12" fill="#fff" stroke="#b9d1d2"/><text class="b" text-anchor="middle" x="612.5" y="197.5">3 Simulation</text><text class="b" text-anchor="middle" x="612.5" y="224.5">模拟 rollout</text><rect x="755" y="155" width="210" height="100" rx="12" fill="#ffe5a2" stroke="#b9d1d2"/><text class="b" text-anchor="middle" x="860.0" y="197.5">4 Backup</text><text class="b" text-anchor="middle" x="860.0" y="224.5">次数与平均回报</text><text class="n" x="40" y="325">Qnew = Qold + (G − Qold) / Nnew</text><text class="n" x="40" y="365">模拟更多次通常改进估计；有限预算并不保证最优。</text></svg>