<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img"><title>Agent: observe → decide → act / 智能体</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#167d87" stroke-width="1.6"/></marker></defs><rect width="1000" height="420" rx="20" fill="#f2f6f5"/><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#172c3b} .t{font-size:24px;font-weight:700}.s{font-size:16px;fill:#526875}.b{font-size:19px;font-weight:600}.n{font-size:17px}</style><text class="t" x="35" y="43">Agent: observe → decide → act / 智能体</text><text class="s" x="35" y="73">Keep information needed for future decisions in the state.</text><path d="M245,195 L370,195" stroke="#167d87" stroke-width="2.4" marker-end="url(#arr)" fill="none"/><text class="s" text-anchor="middle" x="307.5" y="177.0">Z: observation</text><path d="M615,195 L755,195" stroke="#167d87" stroke-width="2.4" marker-end="url(#arr)" fill="none"/><text class="s" text-anchor="middle" x="685.0" y="177.0">π: policy</text><path d="M850,245 L850,320" stroke="#167d87" stroke-width="2.4" marker-end="url(#arr)" fill="none"/><path d="M850,320 L145,320" stroke="#167d87" stroke-width="2.4" marker-end="url(#arr)" fill="none"/><text class="s" text-anchor="middle" x="497.5" y="302.0">T: transition / reward</text><path d="M145,320 L145,245" stroke="#167d87" stroke-width="2.4" marker-end="url(#arr)" fill="none"/><rect x="45" y="150" width="200" height="95" rx="12" fill="#deece9" stroke="#b9d1d2"/><text class="b" text-anchor="middle" x="145.0" y="190.0">State S</text><text class="b" text-anchor="middle" x="145.0" y="217.0">环境状态</text><rect x="370" y="150" width="245" height="95" rx="12" fill="#fff" stroke="#b9d1d2"/><text class="b" text-anchor="middle" x="492.5" y="176.5">Model / plan</text><text class="b" text-anchor="middle" x="492.5" y="203.5">Value / policy</text><text class="b" text-anchor="middle" x="492.5" y="230.5">模型 / 价值 / 策略</text><rect x="755" y="150" width="200" height="95" rx="12" fill="#ffe5a2" stroke="#b9d1d2"/><text class="b" text-anchor="middle" x="855.0" y="190.0">Action A</text><text class="b" text-anchor="middle" x="855.0" y="217.0">动作</text><text class="n" x="45" y="380">未来决策需要的信息必须保留在状态中，例如位置 + 钥匙 + 电量。</text></svg>