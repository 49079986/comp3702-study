<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img"><title>Bellman: average outcomes, then compare actions / 贝尔曼</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#167d87" stroke-width="1.6"/></marker></defs><rect width="1000" height="420" rx="20" fill="#f2f6f5"/><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#172c3b} .t{font-size:24px;font-weight:700}.s{font-size:16px;fill:#526875}.b{font-size:19px;font-weight:600}.n{font-size:17px}</style><text class="t" x="35" y="43">Bellman: average outcomes, then compare actions / 贝尔曼</text><text class="s" x="35" y="73">Q: expected reward + discounted future value. V = max Q; policy = argmax Q.</text><path d="M185,205 L300,205" stroke="#167d87" stroke-width="2.4" marker-end="url(#arr)" fill="none"/><text class="s" text-anchor="middle" x="242.5" y="187.0">Choose</text><path d="M470,190 L620,153" stroke="#167d87" stroke-width="2.4" marker-end="url(#arr)" fill="none"/><text class="s" text-anchor="middle" x="545.0" y="153.5">Successor x</text><path d="M470,230 L620,303" stroke="#167d87" stroke-width="2.4" marker-end="url(#arr)" fill="none"/><text class="s" text-anchor="middle" x="545.0" y="248.5">Successor y</text><rect x="35" y="160" width="150" height="95" rx="12" fill="#fff" stroke="#b9d1d2"/><text class="b" text-anchor="middle" x="110.0" y="200.0">State s</text><text class="b" text-anchor="middle" x="110.0" y="227.0">当前状态</text><rect x="300" y="160" width="170" height="95" rx="12" fill="#ffe5a2" stroke="#b9d1d2"/><text class="b" text-anchor="middle" x="385.0" y="200.0">Action a</text><text class="b" text-anchor="middle" x="385.0" y="227.0">动作</text><rect x="620" y="110" width="320" height="85" rx="12" fill="#deece9" stroke="#b9d1d2"/><text class="b" text-anchor="middle" x="780.0" y="158.5">0.8 × (2 + 0.9 × 5)</text><rect x="620" y="260" width="320" height="85" rx="12" fill="#deece9" stroke="#b9d1d2"/><text class="b" text-anchor="middle" x="780.0" y="308.5">0.2 × (−1 + 0.9 × 1)</text><text class="n" x="40" y="380">Q(s,a)=5.18；若动作 b 的 Q=4，则 V(s)=5.18，π(s)=a。</text></svg>