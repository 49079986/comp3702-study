<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img"><title>Search: different frontier rules / 搜索</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#167d87" stroke-width="1.6"/></marker></defs><rect width="1000" height="420" rx="20" fill="#f2f6f5"/><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#172c3b} .t{font-size:24px;font-weight:700}.s{font-size:16px;fill:#526875}.b{font-size:19px;font-weight:600}.n{font-size:17px}</style><text class="t" x="35" y="43">Search: different frontier rules / 搜索</text><text class="s" x="35" y="73">g = cost so far; h = estimated remaining cost; f = g + h.</text><rect x="35" y="155" width="160" height="100" rx="12" fill="#fff" stroke="#b9d1d2"/><text class="b" text-anchor="middle" x="115.0" y="197.5">BFS</text><text class="b" text-anchor="middle" x="115.0" y="224.5">FIFO / depth</text><rect x="225" y="155" width="160" height="100" rx="12" fill="#fff" stroke="#b9d1d2"/><text class="b" text-anchor="middle" x="305.0" y="197.5">DFS</text><text class="b" text-anchor="middle" x="305.0" y="224.5">LIFO</text><rect x="415" y="155" width="160" height="100" rx="12" fill="#deece9" stroke="#b9d1d2"/><text class="b" text-anchor="middle" x="495.0" y="197.5">UCS</text><text class="b" text-anchor="middle" x="495.0" y="224.5">min g(n)</text><rect x="605" y="155" width="160" height="100" rx="12" fill="#fff" stroke="#b9d1d2"/><text class="b" text-anchor="middle" x="685.0" y="197.5">GBFS</text><text class="b" text-anchor="middle" x="685.0" y="224.5">min h(n)</text><rect x="795" y="155" width="170" height="100" rx="12" fill="#ffe5a2" stroke="#b9d1d2"/><text class="b" text-anchor="middle" x="880.0" y="197.5">A*</text><text class="b" text-anchor="middle" x="880.0" y="224.5">g(n)+h(n)</text><text class="n" x="50" y="325">g：已付成本     h：估计剩余成本     f：完整路径成本估计</text><text class="n" x="50" y="365">路径最少边 ≠ 最低总成本；UCS / A* 通常在目标出队时接受。</text></svg>